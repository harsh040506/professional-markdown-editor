version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      prosemirror:
        patterns: ["prosemirror-*"]
      fonts:
        patterns: ["@fontsource-variable/*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
